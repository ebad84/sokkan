    <path d="M26 70 A38 38 0 0 1 102 70" stroke-width="5.5" />
    <path d="M35 70 A29 29 0 0 1 93 70" stroke-width="2.5" stroke="#BAE6FD" />
    <path d="M53 70 A11 11 0 0 1 75 70" stroke-width="4" />
    <!-- 5 radial spokes & handles -->
    <line x1="64" y1="59" x2="64" y2="20" stroke-width="4.5" stroke="#E0F2FE" />
    <line x1="56" y1="62" x2="36" y2="33" stroke-width="4.2" stroke="#E0F2FE" />
    <line x1="72" y1="62" x2="92" y2="33" stroke-width="4.2" stroke="#E0F2FE" />
    <line x1="53" y1="69" x2="17" y2="69" stroke-width="4.2" stroke="#E0F2FE" />
    <line x1="75" y1="69" x2="111" y2="69" stroke-width="4.2" stroke="#E0F2FE" />
  </g>
  <!-- Docker-inspired stacked containers -->
  <g fill="#38BDF8">
