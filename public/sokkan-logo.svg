    <rect x="52" y="75" width="10" height="8.5" rx="1.5" fill="#E0F2FE" />
    <rect x="64" y="75" width="10" height="8.5" rx="1.5" />
    <rect x="76" y="75" width="10" height="8.5" rx="1.5" fill="#E0F2FE" />
    <rect x="52" y="64.5" width="10" height="8.5" rx="1.5" />
    <rect x="64" y="64.5" width="10" height="8.5" rx="1.5" fill="#7DD3FC" />
    <rect x="76" y="64.5" width="10" height="8.5" rx="1.5" />
    <rect x="64" y="54" width="10" height="8.5" rx="1.5" fill="#38BDF8" />
  </g>
  <!-- Docker-inspired whale hull & tail -->
  <path
    d="M32 87 H88 C95 87 99 81 101 75 C105 76 109 79 111 82 C107 88 101 91 95 92 C90 103 77 109 61 109 C44 109 32 99 32 87 Z"
