services:
  caddy:
    image: caddy:2-alpine
    container_name: caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./caddy:/etc/caddy
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - caddy_net

  sokanyar-panel:
    build: .
    container_name: sokanyar-panel
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./data:/app/data
      - ./caddy:/etc/caddy
    networks:
      - caddy_net
    ports:
      - "127.0.0.1:3000:3000"

  beszel:
    image: henrygd/beszel:latest
    container_name: beszel
    restart: unless-stopped
    profiles: ["beszel"]
    networks:
      - caddy_net
    volumes:
      - ./beszel_data:/beszel_data
    ports:
      - "127.0.0.1:8090:8090"

  beszel-agent:
    image: henrygd/beszel-agent:latest
    container_name: beszel-agent
    restart: unless-stopped
    profiles: ["beszel"]
    network_mode: host
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      LISTEN: "45876"

  kuma:
    image: louislam/uptime-kuma:2
    container_name: kuma
    restart: unless-stopped
    profiles: ["kuma"]
    networks:
      - caddy_net
    volumes:
      - ./kuma_data:/app/data

volumes:
  caddy_data:
  caddy_config:

networks:
  caddy_net:
    external: true
